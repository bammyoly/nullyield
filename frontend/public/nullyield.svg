<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ambient Gold Glow -->
    <filter id="gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Deep Shadow -->
    <filter id="drop-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <!-- Metallic Gold Gradients -->
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C0" />
      <stop offset="30%" stop-color="#F2C14E" />
      <stop offset="70%" stop-color="#C7922B" />
      <stop offset="100%" stop-color="#8A5A00" />
    </linearGradient>

    <linearGradient id="gold-mid" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE082" />
      <stop offset="50%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#6B4400" />
    </linearGradient>

    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8860B" />
      <stop offset="50%" stop-color="#7A5200" />
      <stop offset="100%" stop-color="#2D1A00" />
    </linearGradient>

    <linearGradient id="gold-bright" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4A017" />
      <stop offset="50%" stop-color="#FFF8D6" />
      <stop offset="100%" stop-color="#AA7A13" />
    </linearGradient>

    <linearGradient id="gold-bevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <g filter="url(#drop-shadow)">
    <!-- =================================────────────────==== -->
    <!-- 1. BACK LOCK SHACKLE (Top Loop behind the N)          -->
    <!-- ===================================================== -->
    <!-- Shackle Outer Outer -->
    <path d="M 180 200 V 140 C 180 80, 332 80, 332 140 V 200" 
          fill="none" stroke="url(#gold-dark)" stroke-width="44" stroke-linecap="round" />
    <!-- Shackle Highlight Inner -->
    <path d="M 180 200 V 140 C 180 80, 332 80, 332 140 V 200" 
          fill="none" stroke="url(#gold-light)" stroke-width="32" stroke-linecap="round" />

    <!-- =================================────────────────==== -->
    <!-- 2. SHIELD / LOCK BODY BASE BACKGROUND                 -->
    <!-- ===================================================== -->
    <path d="M 256 70 L 390 145 V 320 L 256 440 L 122 320 V 145 Z" 
          fill="url(#gold-dark)" opacity="0.3" />

    <path d="M 256 95 L 370 160 V 310 L 256 415 L 142 310 V 160 Z" 
          fill="none" stroke="url(#gold-mid)" stroke-width="12" opacity="0.8" />

    <!-- =================================────────────────==== -->
    <!-- 3. MAIN "N" MONOGRAM (Foreground Layer)              -->
    <!-- ===================================================== -->

    <!-- LEFT VERTICAL PILLAR (3D Facets) -->
    <!-- Left Pillar Base -->
    <path d="M 125 175 L 175 145 V 365 L 125 395 Z" fill="url(#gold-mid)" />
    <!-- Left Pillar Bevel Surface -->
    <path d="M 145 163 L 175 145 V 365 L 145 383 Z" fill="url(#gold-light)" />
    <path d="M 125 175 L 145 163 V 383 L 125 395 Z" fill="url(#gold-dark)" />

    <!-- RIGHT VERTICAL PILLAR (3D Facets) -->
    <!-- Right Pillar Base -->
    <path d="M 337 115 L 387 145 V 335 L 337 365 Z" fill="url(#gold-mid)" />
    <!-- Right Pillar Bevel Surface -->
    <path d="M 337 115 L 362 130 V 350 L 337 365 Z" fill="url(#gold-light)" />
    <path d="M 362 130 L 387 145 V 335 L 362 350 Z" fill="url(#gold-dark)" />

    <!-- CENTRAL DIAGONAL BAR (Interlocking Overlay) -->
    <!-- Diagonal Main Body -->
    <path d="M 125 175 L 387 335 L 387 385 L 125 225 Z" fill="url(#gold-bright)" filter="url(#gold-glow)" />
    <!-- Diagonal Upper Highlight Facet -->
    <path d="M 125 175 L 387 335 L 387 355 L 125 195 Z" fill="url(#gold-light)" />
    <!-- Diagonal Lower Shadow Facet -->
    <path d="M 125 205 L 387 365 L 387 385 L 125 225 Z" fill="url(#gold-dark)" />

    <!-- =================================────────────────==== -->
    <!-- 4. INTERLOCKING LOCK FRONT ACCENT (WEAVE EFFECT)       -->
    <!-- ===================================================== -->
    <!-- Top-Right Lock Arch Overlay (Weaving over diagonal) -->
    <path d="M 292 90 C 330 90, 332 115, 332 145 V 195 L 296 172 V 145 C 296 130, 290 120, 275 116 Z" 
          fill="url(#gold-light)" />
    <path d="M 332 145 L 354 132 V 180 L 332 195 Z" 
          fill="url(#gold-dark)" />

    <!-- Bottom Shield Point Overlay -->
    <path d="M 256 445 L 210 395 L 230 380 L 256 410 L 282 380 L 302 395 Z" 
          fill="url(#gold-bright)" />

    <!-- Edge Facet Highlights -->
    <path d="M 125 175 L 387 335" stroke="url(#gold-bevel)" stroke-width="2.5" fill="none" />
    <path d="M 125 225 L 387 385" stroke="#FFF" stroke-opacity="0.4" stroke-width="1.5" fill="none" />
  </g>
</svg>